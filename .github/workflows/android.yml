name: android

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Decode keystore
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/release.keystore

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build release APK
        env:
          APP_BASE_URL: ${{ vars.APP_BASE_URL }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          gradle assembleRelease --no-daemon

      - name: Rename APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/ReleaseHub-universal.apk
          ls -lh out/

      - uses: softprops/action-gh-release@v2
        with:
          files: out/ReleaseHub-universal.apk
          body: |
            **Author:** Abi Manyu (BlueBarry)
            **Version:** ${{ github.ref_name }}
            **ABI:** armeabi-v7a + arm64-v8a + x86_64 (universal)

            WebView client untuk katalog Release Hub.

            Made by Abi Manyu (BlueBarry) · © 2026 Abi Manyu. All rights reserved.
