name: build-and-deploy

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ADMIN_PASSWORD: ci-not-real
      SESSION_SECRET: ci-not-real-secret-000000000000
      DB_PATH: ./data/ci.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Smoke test
        run: |
          node --disable-warning=ExperimentalWarning server.js &
          PID=$!
          ok=0
          for i in $(seq 1 20); do
            sleep 0.5
            if curl -fsS http://localhost:3000/healthz > /dev/null; then ok=1; break; fi
          done
          if [ "$ok" != "1" ]; then echo "server did not come up"; kill $PID; exit 1; fi
          curl -fsS http://localhost:3000/ > /dev/null
          curl -fsS http://localhost:3000/admin > /dev/null
          kill $PID

  deploy:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Railway CLI
        run: npm i -g @railway/cli
      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE: ${{ secrets.RAILWAY_SERVICE }}
        run: railway up --service "$RAILWAY_SERVICE" --detach
